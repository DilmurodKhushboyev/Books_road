<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Books Road</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar glass">
    <div class="brand"><span class="logo">▲</span> BOOKS ROAD</div>
    <div class="role" id="role-badge"></div>
  </header>

  <main id="views">
    <!-- Qidiruv -->
    <section class="view active" id="view-search">
      <form class="glass search-box" id="search-form" autocomplete="off">
        <input id="search-input" type="search" maxlength="120" placeholder="Kitob yoki narsa nomi..." enterkeyhint="search">
        <button type="submit" class="btn primary">🔎</button>
      </form>
      <div id="search-results" class="list"></div>
    </section>

    <!-- Xarita -->
    <section class="view" id="view-map">
      <div class="glass card">
        <div class="card-title">Do'kon xaritasi <small>77.9 m²</small></div>
        <div id="store-map" class="store-map"></div>
        <div class="legend"><span class="dot dot-full"></span>bor <span class="dot dot-empty"></span>bo'sh · ⬆️ old · ⬇️ orqa</div>
      </div>
    </section>

    <!-- Rasm bilan topish -->
    <section class="view" id="view-photo">
      <div class="glass card">
        <div class="card-title">📷 Rasm bilan topish</div>
        <p class="muted">Narsaning muqovasi aniq ko'rinadigan rasmini tanlang — AI uni bazadan topadi.</p>
        <label class="btn primary file-btn">Rasm tanlash<input type="file" id="find-photo-input" accept="image/*" hidden></label>
      </div>
      <div id="photo-results" class="list"></div>
    </section>

    <!-- Javonga qo'shish (xodimlar) -->
    <section class="view" id="view-add">
      <div class="glass card">
        <div class="card-title">➕ Javonga qo'shish</div>
        <div class="field-row">
          <label>Javon<select id="add-shelf"></select></label>
          <label>Qator<select id="add-level"></select></label>
        </div>
        <p class="muted" id="add-level-hint"></p>
        <label class="btn primary file-btn">📸 Javon rasmini yuklash<input type="file" id="add-photo-input" accept="image/*" capture="environment" hidden></label>
      </div>
      <div id="add-review"></div>
    </section>
  </main>

  <nav class="tabbar glass" id="tabbar">
    <button class="tab active" data-view="search"><span>🔎</span>Qidiruv</button>
    <button class="tab" data-view="map"><span>🗺</span>Xarita</button>
    <button class="tab" data-view="photo"><span>📷</span>Rasm</button>
    <button class="tab hidden" data-view="add" id="tab-add"><span>➕</span>Qo'shish</button>
  </nav>

  <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
  <div class="sheet glass hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <div id="loader" class="loader hidden"><div class="spinner"></div><div id="loader-text">Yuklanmoqda...</div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
